[project]
name = "illo"
version = "2.0.3"
description = "Levitating UFO Companion"
authors = [
    {name = "Charles Doebler", email = "charles.doebler@feralcatai.com"}
]
license = {text = "MIT"}
readme = "README.md"
keywords = [
    "circuitpython",
    "iot",
    "led",
    "adafruit",
    "music",
    "embedded",
    "light-sensing",
    "ufo",
    "levitating",
    "magnetic-levitation",
    "festival",
    "made-in-usa"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Topic :: System :: Hardware",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Games/Entertainment",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Environment :: Embedded Systems",
    "Natural Language :: English",
    "Operating System :: Other OS",
    "Topic :: Scientific/Engineering :: Physics"
]
requires-python = ">=3.7"

[project.urls]
homepage = "https://github.com/feralcatai/ILLO"
repository = "https://github.com/feralcatai/ILLO"
documentation = "https://feralcatai.github.io/ILLO/"
"API Documentation" = "https://feralcatai.github.io/ILLO/"
"README" = "https://github.com/feralcatai/ILLO/blob/main/README.md"
"Bug Reports" = "https://github.com/feralcatai/ILLO/issues"
"Source" = "https://github.com/feralcatai/ILLO"
"Changelog" = "https://github.com/feralcatai/ILLO/releases"
"Quick Start Guide" = "https://github.com/feralcatai/ILLO/blob/main/docs/ILLO_Quick_Start_Guide.md"
"Assembly Guide" = "https://github.com/feralcatai/ILLO/blob/main/docs/ILLO_Assembly_Guide.md"
"Configuration Guide" = "https://github.com/feralcatai/ILLO/blob/main/docs/ILLO_Device_Configuration_Guide.md"
"Bluetooth Control Guide" = "https://github.com/feralcatai/ILLO/blob/main/docs/ILLO_Bluetooth_Control_Guide.md"

# CircuitPython specific configuration - Production Ready
[tool.circuitpython]
target_board = "circuitplayground_bluefruit"
main_file = "code.py"
firmware_version = "10.2.1"
required_libraries = [
    "adafruit_circuitplayground",
    "neopixel",
    "simpleio"
]

# Hardware specifications - Production Grade
[hardware]
board = "Adafruit Circuit Playground Bluefruit"
processor = "ARM Cortex-M4 64MHz (nRF52840)"
circuitpython_version = ">=10.2.1"
flash_memory = "2MB"
ram_memory = "256KB"
platform = "magnetic_levitation_ufo"
enclosure = "recycled_petg_3d_printed"
manufacturing = "made_in_usa"
power_source = "rechargeable_battery: 880 mAh CR123 recommended"
features = [
    "bluetooth_5_0_le",
    "10x_rgb_neopixels", 
    "3axis_accelerometer",
    "microphone_audio_processing",
    "ambient_light_sensor",
    "tactile_buttons",
    "slide_switch",
    "tap_detection",
    "magnetic_levitation_compatible"
]

# Kecksburg Festival Edition — single-routine song player
[festival_edition]
mode = "single_routine"
songs = [
    "close_encounters",
    "xfiles",
    "star_trek",
    "also_sprach"
]
song_encoding = "bpm_plus_sixteenth_notes"
mic_reactivity = true
shadow_detection = true
theremin_trigger = true
serial_memory_reporting = true

# Development tools - Complete
[tool.black]
line-length = 100
target-version = ['py37']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

# Version history - Production Release
[changelog]
"2.0.3" = "Added single-routine song player"
"2.0.2" = "Added automated deployment package builder and GitHub Actions for releases, improved serial monitor with dynamic port selection"
"2.0.1" = "Initial production release - Complete AI companion with levitation integration, sustainable manufacturing"
"1.0.0" = "Initial development release with basic UFO behaviors and audio visualization"

# Release readiness
[release]
status = "production_ready"
target_audience = ["consumers", "developers", "educators", "makers"]
distribution = ["github", "documentation", "hardware_integration"]
support = ["comprehensive_docs", "troubleshooting", "community"]
